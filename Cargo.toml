[workspace]
members = ["crates/engine", "apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
publish = false

# Exact versions. Adding or changing one needs a plan update (AGENTS.md).
[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
libc = "=0.2.189"
windows-sys = "=0.61.2"
tempfile = "=3.27.0"
trybuild = "=1.0.120"
tauri = { version = "=2.11.6", features = [] }
tauri-build = { version = "=2.6.3", features = [] }
