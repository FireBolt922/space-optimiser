[workspace]
members = ["crates/engine", "apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

# Exact versions. Adding or changing one needs a plan update (AGENTS.md).
[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
libc = "=0.2.191"
# Only the `fs` API, which tempfile already enables: no new crates in the lockfile.
rustix = { version = "=1.1.6", default-features = false, features = ["std", "fs"] }
windows-sys = "=0.61.2"
tempfile = "=3.27.0"
trybuild = "=1.0.125"
# Memory, CPU, and process figures for the Overview (phase 14). Only the
# `system` feature; 0.38 is the newest release that supports Rust 1.88.
sysinfo = { version = "=0.38.4", default-features = false, features = ["system"] }
tauri = { version = "=2.11.6", features = [] }
tauri-build = { version = "=2.6.3", features = [] }
# Signed in-app updates (phase 15). Used from Rust only; the webview gets no
# updater permission. No `zip`: it reads only the legacy v1 .zip update
# files (and pulled in a `zip` crate with open advisories); v2 updates are
# the installer itself on Windows and a .tar.gz on macOS.
tauri-plugin-updater = { version = "=2.12.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
