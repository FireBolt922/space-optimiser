# Git hooks. `npm ci` at the repository root installs them (lefthook).
# Every check here also runs in CI; the hooks only catch problems earlier.
# Do not bypass a hook with --no-verify; fix the cause.

pre-commit:
  parallel: true
  commands:
    branch-name:
      run: scripts/check-branch-name.sh
    large-files:
      run: scripts/check-large-files.sh {staged_files}
    rust-format:
      glob: "*.rs"
      run: rustfmt --edition 2024 {staged_files}
      stage_fixed: true
    prettier:
      glob: "*.{ts,tsx,css,json,md,yml,yaml}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    eslint:
      root: "apps/desktop/"
      glob: "*.{ts,tsx}"
      run: npx eslint --max-warnings 0 {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  parallel: false
  commands:
    hygiene:
      run: scripts/hygiene.sh
    rust-lint:
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
    rust-test:
      run: cargo test --workspace --locked
    ui-lint:
      root: "apps/desktop/"
      run: npm run lint
    ui-test:
      root: "apps/desktop/"
      run: npm test
