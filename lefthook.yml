# Git hooks. `npm ci` at the repository root installs them (lefthook).
# They are kept fast and mostly fix things for you; CI is the real gate and
# runs everything on macOS, Ubuntu, and Windows. To run the full CI suite
# locally before you push, use `npm run check`.

pre-commit:
  parallel: true
  commands:
    large-files:
      run: scripts/check-large-files.sh {staged_files}
    rust-format:
      glob: "*.rs"
      run: rustfmt --edition 2024 {staged_files}
      stage_fixed: true
    prettier:
      glob: "*.{ts,tsx,css,json,md,yml,yaml}"
      run: npx prettier --write {staged_files}
      stage_fixed: true

pre-push:
  commands:
    # A few seconds: the delete and process-start rules (see AGENTS.md).
    hygiene:
      run: scripts/hygiene.sh
