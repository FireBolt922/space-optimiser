name: Release

# Releases with one click: Actions → Release → Run workflow on main. It
# raises the version (from the commits since the last tag, or the part you
# pick), moves the Unreleased changelog entries into a dated section, opens
# a pull request with those changes, runs CI on it, and merges it when CI
# is green. It then starts Publish, which builds the installers, tags the
# commit, creates the release page, and rebuilds the download page.
# Nothing is built or tagged here.
#
# If CI fails, the pull request stays open and nothing is released. Fix
# the cause on the branch and merge it by hand: Publish starts on that
# merge by itself.
#
# Needs once, in Settings → Actions → General → Workflow permissions:
# "Allow GitHub Actions to create and approve pull requests".
on:
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          auto: decided by the commits since the last tag (a feature
          raises MINOR, a fix raises PATCH). Or pick the part to raise.
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      channel:
        description: >-
          prerelease: test build for testers (marked "Pre-release").
          release: public release. draft: only you can see it.
        type: choice
        options: [prerelease, draft, release]
        default: prerelease

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pull-request:
    name: open, test, and merge the release pull request
    runs-on: ubuntu-latest
    # Most of the time is spent waiting for CI on the release branch.
    timeout-minutes: 180
    permissions:
      contents: write # push the release branch and merge it
      pull-requests: write # open and merge the pull request
      actions: write # read CI runs, start CI, and start Publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags and every commit since the last one

      - name: Run from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Run the Release workflow from main, not ${GITHUB_REF}." >&2
          exit 1

      # A release starts from a commit whose tests passed.
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$passed" -lt 1 ]; then
            echo "CI has not passed on ${GITHUB_SHA}. Wait for the CI run on main to go green." >&2
            exit 1
          fi

      - name: Choose the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if ! git ls-remote --exit-code --tags origin "refs/tags/v${current}" >/dev/null; then
            echo "v${current} is not released yet. Merge its release pull request, or run the Publish workflow if that is already merged." >&2
            exit 1
          fi
          next=$(scripts/next-version.sh "$BUMP")
          branch="chore/release-v${next}"
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null; then
            echo "Branch ${branch} exists: a release pull request for v${next} is already open. Merge or close it first." >&2
            exit 1
          fi
          {
            echo "current=$current"
            echo "version=$next"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

      # Version comes from rust-toolchain.toml. The bump script rewrites
      # the workspace entries in Cargo.lock with cargo.
      - name: Install Rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Raise the version and date the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/bump-version.sh "$VERSION"

      - name: Push the release branch
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add Cargo.toml Cargo.lock apps/desktop/package.json apps/desktop/package-lock.json CHANGELOG.md
          git commit -m "chore(release): v${VERSION}"
          git push origin "$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          CURRENT: ${{ steps.version.outputs.current }}
          BRANCH: ${{ steps.version.outputs.branch }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          {
            echo "Channel: ${CHANNEL}"
            echo
            echo "Raises the version from ${CURRENT} to ${VERSION} and dates the changelog."
            echo "The Release workflow merges this pull request when CI is green and starts"
            echo "Publish, which builds the installers, tags \`v${VERSION}\`, and creates the"
            echo "release page on the channel above. If CI fails, fix it on this branch and"
            echo "merge by hand; Publish then reads the channel from the first line"
            echo "(prerelease, draft, or release)."
            echo
            echo "## Changes in ${VERSION}"
            echo
            scripts/changelog-section.sh "$VERSION"
          } > body.md
          if ! url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "chore(release): v${VERSION}" --body-file body.md); then
            echo "Could not open the pull request. In Settings → Actions → General → Workflow permissions, allow GitHub Actions to create and approve pull requests, then run again." >&2
            git push origin --delete "$BRANCH"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # A pull request opened with the workflow token does not start CI by
      # itself, so CI is started on the branch here.
      - name: Start CI on the branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          URL: ${{ steps.pr.outputs.url }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          {
            echo "## Release pull request for v${VERSION}"
            echo
            echo "${URL}"
            echo
            echo "It merges when CI is green, and Publish then releases v${VERSION} as a ${CHANNEL}."
          } >> "$GITHUB_STEP_SUMMARY"

      # `gh workflow run` returns before the run exists, so the run is
      # looked up by the commit until it shows.
      - name: Wait for CI on the branch
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.push.outputs.sha }}
          URL: ${{ steps.pr.outputs.url }}
        run: |
          run=""
          for _ in $(seq 1 30); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" \
              --event workflow_dispatch --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "$run" ]; then
            echo "CI did not start on ${SHA}. Start it on the branch, then merge ${URL} by hand when it is green." >&2
            exit 1
          fi
          if ! gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 60 >/dev/null; then
            echo "CI failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run}" >&2
            echo "Nothing was released. Fix the cause on the branch and merge ${URL} by hand; Publish starts on the merge." >&2
            exit 1
          fi
          echo "CI passed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run}"

      # The ruleset still applies: the merge goes through only with every
      # required check green and the branch up to date with main.
      # --match-head-commit refuses if anything was pushed to the branch
      # after the commit that CI tested. The checks can take a moment to
      # show as passed after the run ends, so the merge is retried.
      - name: Merge the pull request
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.push.outputs.sha }}
          URL: ${{ steps.pr.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if gh pr merge "$URL" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$SHA"; then
              merged=$(gh pr view "$URL" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq .mergeCommit.oid)
              echo "sha=$merged" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Merge attempt ${attempt} refused; trying again in 20 seconds."
            sleep 20
          done
          echo "Could not merge ${URL}. If main moved while CI ran, update the branch, wait for CI, and merge by hand; Publish starts on the merge." >&2
          exit 1

      - name: Delete the release branch
        env:
          BRANCH: ${{ steps.version.outputs.branch }}
        run: git push origin --delete "$BRANCH" || echo "Could not delete ${BRANCH}; delete it by hand."

      # A merge made with the workflow token does not start push workflows,
      # so Publish and the CI run on main are started here. Publish builds
      # the head of main, so it starts only while that is still the release
      # commit. The CI run on main lets the next Release run start from it.
      - name: Start Publish
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED: ${{ steps.merge.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$MERGED" ]; then
            echo "main moved past the release commit ${MERGED} before Publish could start. Run Actions → Publish by hand only if main holds v${VERSION} and nothing unreleased." >&2
            exit 1
          fi
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f channel="$CHANNEL"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
          {
            echo
            echo "Merged as ${MERGED}. Publish is building v${VERSION}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/publish.yml"
          } >> "$GITHUB_STEP_SUMMARY"
