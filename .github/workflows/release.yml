name: Release

# Starts a release: Actions → Release → Run workflow on main. It raises
# the version (from the commits since the last tag, or the part you pick),
# moves the Unreleased changelog entries into a dated section, and opens a
# pull request with those changes and CI running on it. Merge that pull
# request when CI is green: the Publish workflow then builds the
# installers, tags the commit, and creates the release page. Nothing is
# built or tagged here.
#
# Needs once, in Settings → Actions → General → Workflow permissions:
# "Allow GitHub Actions to create and approve pull requests".
on:
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          auto: decided by the commits since the last tag (a feature
          raises MINOR, a fix raises PATCH). Or pick the part to raise.
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      channel:
        description: >-
          prerelease: test build for testers (marked "Pre-release").
          release: public release. draft: only you can see it.
        type: choice
        options: [prerelease, draft, release]
        default: prerelease

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pull-request:
    name: open the release pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release branch
      pull-requests: write # open the pull request
      actions: write # read CI runs and start CI on the branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags and every commit since the last one

      - name: Run from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Run the Release workflow from main, not ${GITHUB_REF}." >&2
          exit 1

      # A release starts from a commit whose tests passed.
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$passed" -lt 1 ]; then
            echo "CI has not passed on ${GITHUB_SHA}. Wait for the CI run on main to go green." >&2
            exit 1
          fi

      - name: Choose the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if ! git ls-remote --exit-code --tags origin "refs/tags/v${current}" >/dev/null; then
            echo "v${current} is not released yet. Merge its release pull request, or run the Publish workflow if that is already merged." >&2
            exit 1
          fi
          next=$(scripts/next-version.sh "$BUMP")
          branch="chore/release-v${next}"
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null; then
            echo "Branch ${branch} exists: a release pull request for v${next} is already open. Merge or close it first." >&2
            exit 1
          fi
          {
            echo "current=$current"
            echo "version=$next"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

      # Version comes from rust-toolchain.toml. The bump script rewrites
      # the workspace entries in Cargo.lock with cargo.
      - name: Install Rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Raise the version and date the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/bump-version.sh "$VERSION"

      - name: Push the release branch
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add Cargo.toml Cargo.lock apps/desktop/package.json apps/desktop/package-lock.json CHANGELOG.md
          git commit -m "chore(release): v${VERSION}"
          git push origin "$BRANCH"

      - name: Open the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          CURRENT: ${{ steps.version.outputs.current }}
          BRANCH: ${{ steps.version.outputs.branch }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          {
            echo "Channel: ${CHANNEL}"
            echo
            echo "Raises the version from ${CURRENT} to ${VERSION} and dates the changelog."
            echo "Merge this pull request when CI is green. The Publish workflow then builds"
            echo "the installers, tags \`v${VERSION}\`, and creates the release page on the"
            echo "channel above (edit the first line to change it: prerelease, draft, or release)."
            echo
            echo "## Changes in ${VERSION}"
            echo
            scripts/changelog-section.sh "$VERSION"
          } > body.md
          if ! url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "chore(release): v${VERSION}" --body-file body.md); then
            echo "Could not open the pull request. In Settings → Actions → General → Workflow permissions, allow GitHub Actions to create and approve pull requests, then run again." >&2
            git push origin --delete "$BRANCH"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # A pull request opened with the workflow token does not start CI by
      # itself, so CI is started on the branch here.
      - name: Start CI on the branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          URL: ${{ steps.pr.outputs.url }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          {
            echo "## Release pull request for v${VERSION}"
            echo
            echo "${URL}"
            echo
            echo "Merge it when CI is green. Publish then builds and releases v${VERSION} as a ${CHANNEL}."
          } >> "$GITHUB_STEP_SUMMARY"
