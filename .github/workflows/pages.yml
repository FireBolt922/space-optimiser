name: Pages

# Builds the download page (site/) from the published releases and deploys
# it to GitHub Pages. The Publish workflow starts it after each release. It
# also runs when the page's files change, once a day (to pick up a release
# edited by hand, such as a pre-release marked as a full release), and by
# hand from Actions → Pages → Run workflow.
#
# Not on `release` events: they run on the tag, and the github-pages
# environment accepts deployments from main only.
#
# Needs once, in Settings → Pages → Build and deployment: Source "GitHub
# Actions".
on:
  push:
    branches: [main]
    paths:
      - site/**
      - apps/desktop/src/styles/tokens.css
      - apps/desktop/src/assets/fonts/**
      - apps/desktop/src-tauri/icons/128x128.png
      - .github/workflows/pages.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a queued run waits rather than cancelling a
# deployment halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the download page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Test the page renderer
        run: node --test 'site/*.test.mjs'

      # Drafts are left out by the renderer.
      - name: Build the page
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node site/build.mjs --repo "$GITHUB_REPOSITORY" --out _site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Summary
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Download page: ${URL}" >> "$GITHUB_STEP_SUMMARY"
