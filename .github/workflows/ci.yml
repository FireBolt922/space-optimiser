name: CI

# Runs only when commits land on main (a direct push or a merged pull request).
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Version comes from rust-toolchain.toml. The compile-fail test output
      # depends on the compiler version, so CI and local builds must match.
      - name: Install Rust
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Install WebKitGTK (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # The Tauri shell embeds the built UI, so build it before cargo.
      - name: Build UI
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - name: No delete calls outside the executor
        shell: bash
        run: |
          if grep -rnE 'remove_file|remove_dir|Command::new' crates apps/desktop/src-tauri/src; then
            echo "Delete and process calls are not allowed in milestone M1." >&2
            exit 1
          fi

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
