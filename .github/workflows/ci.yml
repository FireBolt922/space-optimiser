name: CI

# Runs only when commits land on main (a direct push or a merged pull request).
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Version comes from rust-toolchain.toml. The compile-fail test output
      # depends on the compiler version, so CI and local builds must match.
      - name: Install Rust
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Install WebKitGTK (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # The Tauri shell embeds the built UI, so build it before cargo.
      - name: Build, lint, and test UI
        working-directory: apps/desktop
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      # tests/hygiene.rs names these calls in order to forbid them.
      - name: Delete calls only in the executor
        shell: bash
        run: |
          if grep -rnE --exclude=hygiene.rs 'remove_file|remove_dir|Command::new' crates apps/desktop/src-tauri/src; then
            echo "std::fs::remove_* and process spawning are not allowed. Deletes go through the executor." >&2
            exit 1
          fi
          if grep -rlE --include='*.rs' --exclude=hygiene.rs 'unlinkat|REMOVEDIR' crates apps/desktop/src-tauri/src | grep -vx 'crates/engine/src/execute.rs'; then
            echo "Handle-relative deletes are allowed only in crates/engine/src/execute.rs." >&2
            exit 1
          fi

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
