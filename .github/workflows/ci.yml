name: CI

# Runs only when commits land on main (a direct push or a merged pull request).
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Version comes from rust-toolchain.toml. The compile-fail test output
      # depends on the compiler version, so CI and local builds must match.
      - name: Install Rust
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Install WebKitGTK (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # The Tauri shell embeds the built UI, so build it before cargo.
      - name: Build, lint, and test UI
        working-directory: apps/desktop
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      # tests/hygiene.rs names these calls in order to forbid them.
      - name: Delete calls only in the executor, processes only in the tool runner
        shell: bash
        run: |
          if grep -rnE --exclude=hygiene.rs 'remove_file|remove_dir' crates apps/desktop/src-tauri/src; then
            echo "std::fs::remove_* is not allowed. Deletes go through the executor." >&2
            exit 1
          fi
          if grep -rlE --include='*.rs' --exclude=hygiene.rs 'Command::new' crates apps/desktop/src-tauri/src | grep -vx 'crates/engine/src/tool.rs'; then
            echo "Processes start only in crates/engine/src/tool.rs." >&2
            exit 1
          fi
          if grep -rnE --include='*.rs' --exclude=hygiene.rs 'DeleteFileW|RemoveDirectoryW|SHFileOperation|IFileOperation|MOVEFILE_DELAY_UNTIL_REBOOT|MoveFileEx|FILE_FLAG_DELETE_ON_CLOSE|FILE_DELETE_ON_CLOSE|NtSetInformationFile|libc::unlink|libc::rmdir' crates apps/desktop/src-tauri/src; then
            echo "Path-based Windows deletes are not allowed. Deletes go through the executor." >&2
            exit 1
          fi
          if grep -rlE --include='*.rs' --exclude=hygiene.rs 'CreateProcessW|ShellExecute' crates apps/desktop/src-tauri/src; then
            echo "Processes start only in crates/engine/src/tool.rs." >&2
            exit 1
          fi
          if grep -rlE --include='*.rs' --exclude=hygiene.rs 'unlinkat|REMOVEDIR|FileDispositionInfo|FILE_DISPOSITION_FLAG_DELETE' crates apps/desktop/src-tauri/src | grep -vxE 'crates/engine/src/execute.rs|crates/engine/src/execute/[^/]+\.rs'; then
            echo "Handle-relative deletes are allowed only in the executor (crates/engine/src/execute.rs and crates/engine/src/execute/)." >&2
            exit 1
          fi

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # Creates 1,000,000 empty files, so it is ignored by default and run
      # only on Linux.
      - name: Large-tree cancel (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 30
        run: cargo test -p space-optimiser-engine --test large_cancel --locked -- --ignored --test-threads=1
