name: CI

# Runs on pull requests: a pull request is tested once, and merging it
# starts nothing. A pull request that changes only documentation skips the
# builds and tests. The one required check is "CI passed", which sums up
# the jobs below. Coverage runs only by hand: Actions → CI → Run workflow.
# A weekly run on main refreshes the build cache that pull requests start
# from and checks for new dependency advisories.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

# A new push to a pull request cancels the run for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      dependencies: ${{ steps.diff.outputs.dependencies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the merge commit and the base it was made on

      # Documentation is Markdown, docs/, the download page (its own tests
      # run in "formatting and commit messages"), and GitHub's templates.
      - name: Compare with the base branch
        id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "dependencies=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          printf '%s\n' "$files"
          code=$(printf '%s\n' "$files" | grep -Ev '(\.md$|^docs/|^site/|^LICENSE|^\.github/(ISSUE_TEMPLATE|rulesets)/)' || true)
          deps=$(printf '%s\n' "$files" | grep -E '(^|/)(Cargo\.toml|Cargo\.lock|deny\.toml|package\.json|package-lock\.json)$' || true)
          echo "code=$([ -n "$code" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "dependencies=$([ -n "$deps" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from rust-toolchain.toml. The compile-fail test output
      # depends on the compiler version, so CI and local builds must match.
      - name: Install Rust
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      # Keeps compiled dependencies between runs. Pull requests start from
      # the cache of the weekly run on main.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install WebKitGTK (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # The Tauri shell embeds the built UI, so build it before cargo.
      - name: Build, lint, and test UI
        working-directory: apps/desktop
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Delete calls only in the executor, processes only in the tool runner
        shell: bash
        run: scripts/hygiene.sh

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee test-output.log

      # The log of a failed step is visible only to signed-in users; the
      # run summary is public, so the failing tests are copied there.
      - name: Failing tests in the run summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Failing tests on ${{ matrix.os }}"
            echo
            echo '```text'
            grep -E 'FAILED|panicked at|^failures:|^---- ' test-output.log | head -n 60 || true
            echo
            awk '/^failures:$/{flag=1} flag' test-output.log | head -n 200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Creates 1,000,000 empty files, so it is ignored by default and run
      # only on Linux.
      - name: Large-tree cancel (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 30
        run: cargo test -p space-optimiser-engine --test large_cancel --locked -- --ignored --test-threads=1

  tooling:
    name: formatting and commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install repository tooling
        run: npm ci --ignore-scripts

      - name: Prettier
        run: npx prettier --check .

      - name: Download page renderer and updater manifest
        run: node --test 'site/*.test.mjs' 'scripts/*.test.mjs'

      # PRs are squash-merged, so the PR title becomes the commit on main.
      - name: PR title is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx commitlint

  dependencies:
    name: dependency licences and advisories
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          arguments: --all-features

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: npm audit (desktop, production dependencies)
        working-directory: apps/desktop
        run: npm audit --omit=dev --audit-level=high

  coverage:
    name: test coverage
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add llvm-tools-preview

      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov@0.9.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: UI coverage
        working-directory: apps/desktop
        shell: bash
        run: |
          set -o pipefail
          npm ci
          npm run test:coverage 2>&1 | tee ui-coverage.txt
          npm run build

      - name: Engine coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --locked --lcov --output-path coverage/engine.lcov
          cargo llvm-cov report --summary-only | tee coverage/engine-summary.txt

      - name: Coverage in the run summary
        run: |
          {
            echo "## Engine coverage"
            echo '```text'
            cat coverage/engine-summary.txt
            echo '```'
            echo "## UI coverage"
            echo '```text'
            grep -E '^(Statements|Branches|Functions|Lines)' apps/desktop/ui-coverage.txt || echo "see the coverage artifact"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage/
            apps/desktop/coverage/
          retention-days: 14

  # The only check the main-branch ruleset requires. A skipped job (a
  # documentation-only change) counts as passed; a failed or cancelled
  # one does not.
  result:
    name: CI passed
    needs: [changes, test, tooling, dependencies]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case $r in success | skipped) ;; *) exit 1 ;; esac
          done
