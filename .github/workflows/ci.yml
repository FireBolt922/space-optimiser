name: CI

# Runs on every pull request and on every commit that lands on main. The
# Release and Publish workflows refuse a commit without a green CI run.
# The Release workflow also starts it by hand on a release branch, because
# a pull request opened with the workflow token does not start CI.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from rust-toolchain.toml. The compile-fail test output
      # depends on the compiler version, so CI and local builds must match.
      - name: Install Rust
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Install WebKitGTK (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # The Tauri shell embeds the built UI, so build it before cargo.
      - name: Build, lint, and test UI
        working-directory: apps/desktop
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Delete calls only in the executor, processes only in the tool runner
        shell: bash
        run: scripts/hygiene.sh

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee test-output.log

      # The log of a failed step is visible only to signed-in users; the
      # run summary is public, so the failing tests are copied there.
      - name: Failing tests in the run summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Failing tests on ${{ matrix.os }}"
            echo
            echo '```text'
            grep -E 'FAILED|panicked at|^failures:|^---- ' test-output.log | head -n 60 || true
            echo
            awk '/^failures:$/{flag=1} flag' test-output.log | head -n 200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Creates 1,000,000 empty files, so it is ignored by default and run
      # only on Linux.
      - name: Large-tree cancel (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 30
        run: cargo test -p space-optimiser-engine --test large_cancel --locked -- --ignored --test-threads=1

  tooling:
    name: formatting and commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install repository tooling
        run: npm ci --ignore-scripts

      - name: Prettier
        run: npx prettier --check .

      - name: Download page renderer
        run: node --test 'site/*.test.mjs'

      # PRs are squash-merged, so the PR title becomes the commit on main.
      - name: PR title is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx commitlint

      - name: Commits on main are Conventional Commits
        if: github.event_name == 'push'
        run: npx commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}"

      - name: Commits on the branch are Conventional Commits
        if: github.event_name == 'workflow_dispatch'
        run: npx commitlint --from "$(git merge-base origin/main HEAD)" --to HEAD

  dependencies:
    name: dependency licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: npm audit (desktop, production dependencies)
        working-directory: apps/desktop
        run: npm audit --omit=dev --audit-level=high

  coverage:
    name: test coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add llvm-tools-preview

      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-llvm-cov@0.9.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: UI coverage
        working-directory: apps/desktop
        shell: bash
        run: |
          set -o pipefail
          npm ci
          npm run test:coverage 2>&1 | tee ui-coverage.txt
          npm run build

      - name: Engine coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --locked --lcov --output-path coverage/engine.lcov
          cargo llvm-cov report --summary-only | tee coverage/engine-summary.txt

      - name: Coverage in the run summary
        run: |
          {
            echo "## Engine coverage"
            echo '```text'
            cat coverage/engine-summary.txt
            echo '```'
            echo "## UI coverage"
            echo '```text'
            grep -E '^(Statements|Branches|Functions|Lines)' apps/desktop/ui-coverage.txt || echo "see the coverage artifact"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage/
            apps/desktop/coverage/
          retention-days: 14
